name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name"
        required: true
        default: "v0.2.0"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets and decode keystore
        env:
          NOTA_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOTA_RELEASE_KEYSTORE_BASE64 }}
          NOTA_RELEASE_STORE_PASSWORD: ${{ secrets.NOTA_RELEASE_STORE_PASSWORD }}
          NOTA_RELEASE_KEY_ALIAS: ${{ secrets.NOTA_RELEASE_KEY_ALIAS }}
          NOTA_RELEASE_KEY_PASSWORD: ${{ secrets.NOTA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$NOTA_RELEASE_KEYSTORE_BASE64" || { echo "Missing NOTA_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$NOTA_RELEASE_STORE_PASSWORD" || { echo "Missing NOTA_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$NOTA_RELEASE_KEY_ALIAS" || { echo "Missing NOTA_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$NOTA_RELEASE_KEY_PASSWORD" || { echo "Missing NOTA_RELEASE_KEY_PASSWORD"; exit 1; }
          mkdir -p app/keystore
          printf '%s' "$NOTA_RELEASE_KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore
          chmod 600 app/keystore/release.keystore

      - name: Build signed release APK
        env:
          NOTA_RELEASE_KEYSTORE_PATH: app/keystore/release.keystore
          NOTA_RELEASE_STORE_PASSWORD: ${{ secrets.NOTA_RELEASE_STORE_PASSWORD }}
          NOTA_RELEASE_KEY_ALIAS: ${{ secrets.NOTA_RELEASE_KEY_ALIAS }}
          NOTA_RELEASE_KEY_PASSWORD: ${{ secrets.NOTA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify release APK signature
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Nota-${TAG_NAME}.apk"
          gh release create "${TAG_NAME}" "Nota-${TAG_NAME}.apk" \
            --title "Nota ${TAG_NAME}" \
            --notes "Monochrome local Android music player release (${TAG_NAME})." \
            --latest
